name: CI Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -f txt